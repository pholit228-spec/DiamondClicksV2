name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # mod.json "geode" must match the SDK major/minor, so sync it with the latest release
      - name: Sync mod.json with latest Geode SDK version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/geode-sdk/geode/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"v?([^"]+)".*/\1/' || true)
          echo "Latest Geode SDK: '$V'"
          if [ -n "$V" ]; then
            sed -i.bak -E "s/\"geode\": *\"[^\"]*\"/\"geode\": \"$V\"/" mod.json && rm -f mod.json.bak
          fi
          grep '"geode"' mod.json

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
